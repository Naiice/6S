<script>/* Google-authenticated Apps Script transport for a GitHub Pages frontend. */
(() => {
  'use strict';
  const protocol=1,methods=new Set(['getDashboardData','saveIssue','saveAudit','getEvidenceImage']);
  const cfg=window.FIVE_S_CONFIG||{},pending=new Map();
  let frame=null,popup=null,peer=null,peerOrigin='',channel='',ready=false,connection=null,connectionTimer=null,popupMonitor=null,sequence=0;
  const number=(v,fallback,min,max)=>Math.max(min,Math.min(max,Number(v)||fallback));
  const error=(message,kind)=>{const e=new Error(message);if(kind)e.kind=kind;return e;};
  function endpoint(){
    if(!cfg.WEB_APP_URL)throw error('ยังไม่ได้ตั้ง WEB_APP_URL ในไฟล์ HTML');
    let url;try{url=new URL(cfg.WEB_APP_URL);}catch(_){throw error('URL เชื่อมต่อไม่ถูกต้อง');}
    if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname))throw error('ใช้ URL Web app ของ Google Apps Script ที่ลงท้าย /exec');

    url.search='';url.hash='';return url;
  }
  function googleOrigin(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||/^[a-z0-9-]+-script\.googleusercontent\.com$/.test(u.hostname));}catch(_){return false;}}
  function notify(message){window.dispatchEvent(new CustomEvent('five-s-connection',{detail:{connected:ready,message}}));}
  function rejectRequests(message){for(const p of pending.values()){clearTimeout(p.timer);p.reject(error(message,['saveIssue','saveAudit'].includes(p.method)?'WRITE_RESULT_UNKNOWN':undefined));}pending.clear();}
  function reset(message){
    ready=false;peer=null;peerOrigin='';clearTimeout(connectionTimer);clearInterval(popupMonitor);
    if(frame){frame.remove();frame=null;}
    if(connection){connection.reject(error(message));connection=null;}
    rejectRequests(message);
  }
  function post(message){if(!ready||!peer)throw error('กรุณาเชื่อมบัญชี Google ก่อน');peer.postMessage({protocol,channel,...message},peerOrigin);}
  function connect({popup:usePopup=false}={}){
    let url;try{url=endpoint();}catch(e){return Promise.reject(e);}
    reset('กำลังเริ่มการเชื่อมต่อใหม่');
    channel=crypto.randomUUID();
    url.searchParams.set('view','github');url.searchParams.set('mode',usePopup?'popup':'frame');
    url.searchParams.set('host',location.origin);url.searchParams.set('channel',channel);
    const promise=new Promise((resolve,reject)=>{connection={resolve,reject};});
    if(usePopup){
      popup=window.open(url.href,'five-s-google-connection','popup,width=540,height=680');
      if(!popup){reset('เบราว์เซอร์ยังไม่อนุญาตให้เปิดหน้าต่าง Google');return promise;}
      popupMonitor=setInterval(()=>{try{if(popup.closed){reset('หน้าต่าง Google ปิดแล้ว กรุณาเชื่อมต่อใหม่');notify('หน้าต่าง Google ปิดแล้ว');}}catch(_){}},1000);
    }else{
      popup=null;frame=document.createElement('iframe');frame.title='การเชื่อมต่อ Google Sheets';frame.hidden=true;frame.src=url.href;document.body.appendChild(frame);
    }
    connectionTimer=setTimeout(()=>{
      reset('ยังเชื่อมต่อไม่ได้ กรุณาเปิด Google เพื่อตรวจบัญชีและอนุญาตสิทธิ์ก่อน แล้วลองเชื่อมต่ออีกครั้ง หรือใช้ปุ่มเชื่อมผ่านหน้าต่าง Google');
      notify('การเชื่อมต่อยังไม่พร้อม');
    },number(cfg.CONNECT_TIMEOUT_MS,30000,10000,120000));
    return promise;
  }
  function call(method,...args){
    if(!methods.has(method))return Promise.reject(error('ไม่รองรับคำสั่งนี้'));
    if(!ready||!peer)return Promise.reject(error('กรุณาเชื่อมบัญชี Google ก่อน'));
    const id=channel+':'+(++sequence);
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{pending.delete(id);reject(error('ยังไม่ได้รับผลตอบกลับ กรุณาเชื่อมต่อและโหลดข้อมูลเพื่อตรวจสอบก่อนบันทึกเพิ่ม',['saveIssue','saveAudit'].includes(method)?'WRITE_RESULT_UNKNOWN':undefined));},number(cfg.REQUEST_TIMEOUT_MS,90000,30000,180000));
      pending.set(id,{resolve,reject,timer,method});
      try{post({type:'rpc',id,method,args});}catch(e){clearTimeout(timer);pending.delete(id);reject(e);}
    });
  }
  function authorize(){
    const url=endpoint();url.searchParams.set('view','authorize');
    const tab=window.open(url.href,'five-s-google-authorize','noopener');
    /* noopener may intentionally return null even when the browser opened the tab. */
    return url.href;
  }
  window.addEventListener('message',event=>{
    const m=event.data;
    if(!m||typeof m!=='object'||m.protocol!==protocol||m.channel!==channel||!googleOrigin(event.origin)||!event.source)return;
    if(m.type==='ready'&&!ready&&connection){
      peer=event.source;peerOrigin=event.origin;ready=true;clearTimeout(connectionTimer);
      const c=connection;connection=null;post({type:'ack'});c.resolve();notify('เชื่อมบัญชี Google แล้ว');return;
    }
    if(event.source!==peer||event.origin!==peerOrigin||!ready)return;
    if(m.type==='result'&&typeof m.id==='string'){
      const p=pending.get(m.id);if(!p)return;clearTimeout(p.timer);pending.delete(m.id);
      if(m.ok===true)p.resolve(m.result);else p.reject(error(typeof m.message==='string'?m.message:'บันทึกไม่สำเร็จ'));
    }
  });
  window.FiveSApi=Object.freeze({connect,call,authorize,isConnected:()=>ready,isConfigured:()=>!!cfg.WEB_APP_URL});
})();
</script>
<script>(()=>{
const root=document.getElementById('five-s-app'),main=root.querySelector('#s-main');
const state={page:'overview',previous:'overview',area:'all',filter:'open',detail:null,parent:null,flash:'',busy:false,loaded:false,stale:false};
let connectionGeneration=0;
let db={issues:[],audits:[],history:[],people:[],areas:[],categories:[],priorities:[],settings:{},user:null,today:'',serverTime:''},timer;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const idText=id=>id?'#'+String(id).slice(-8).toUpperCase():'';
const fmt=d=>d?new Date(d.slice(0,10)+'T00:00:00Z').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'ยังไม่กำหนด';
const name=email=>db.people.find(p=>p.email===email)?.name||email||'ยังไม่มอบหมาย';
const canCreate=()=>['ADMIN','EDITOR'].includes(db.user?.role);
const canAudit=()=>['ADMIN','EDITOR','VERIFIER'].includes(db.user?.role);
const isAdmin=()=>db.user?.role==='ADMIN';
const late=x=>x.status!=='closed'&&x.dueDate&&x.dueDate<db.today;
const days=d=>d?Math.max(0,Math.round((Date.parse(db.today)-Date.parse(d))/86400000)):0;
const subset=()=>db.issues.filter(x=>state.area==='all'||x.area===state.area);
const badge=x=>'<span class="badge '+esc(x.status)+'">'+esc(db.statuses[x.status])+'</span>';
const actor=x=>x.status==='monitor'&&!x.implementedDate?x.preventionOwnerEmail:['verify','monitor'].includes(x.status)?x.reviewerEmail:x.ownerEmail;
const next=x=>({new:'มอบหมายและกำหนดเสร็จ',work:'แก้ไขและส่งตรวจ',verify:'ตรวจแก้ไขและวางแผนป้องกัน',monitor:x.implementedDate?'ตรวจติดตามผลป้องกัน':'ยืนยันทำมาตรการ แล้วตรวจติดตาม',closed:'เฝ้าระวังตามมาตรฐาน'})[x.status];
const rootId=x=>{let p=x;const seen=new Set();while(p.parentId&&!seen.has(p.id)){seen.add(p.id);const old=db.issues.find(i=>i.id===p.parentId);if(!old)break;p=old}return p.id};
const cluster=x=>db.issues.filter(i=>rootId(i)===rootId(x)).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)||a.id.localeCompare(b.id));
const options=(vs,current,blank)=>`${blank?'<option value="">'+esc(blank)+'</option>':''}${vs.map(v=>{const o=typeof v==='string'?{value:v,label:v}:v;return '<option value="'+esc(o.value)+'" '+(o.value===current?'selected':'')+'>'+esc(o.label)+'</option>'}).join('')}`;
const peopleOptions=roles=>db.people.filter(p=>roles.includes(p.role)).map(p=>({value:p.email,label:p.name+' · '+p.email}));
const field=(key,label,value='',type='text',required=false)=>'<label class="field">'+label+(required?' *':'')+'<input name="'+key+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'></label>';
const text=(key,label,value='')=>'<label class="field">'+label+'<textarea name="'+key+'">'+esc(value)+'</textarea></label>';
const select=(key,label,values,value='',required=false)=>'<label class="field">'+label+(required?' *':'')+'<select name="'+key+'" '+(required?'required':'')+'>'+options(values,value,'เลือก'+label)+'</select></label>';
const photo=(key,label)=>'<label class="field">'+label+'<input name="'+key+'" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label>';
const uuid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)+'-'+Math.random().toString(16).slice(2);
const formStart=(action,id='s-action-form')=>'<form id="'+id+'" data-action="'+action+'"><input type="hidden" name="requestId" value="'+uuid()+'"><div class="form-error s-form-error" role="alert" hidden></div>';
function symbols(){if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function announce(s){root.querySelector('#s-live').textContent=s;}
function rpc(fn,...args){return FiveSApi.call(fn,...args);}
function connectionPanel(message=''){
  const configured=FiveSApi.isConfigured();
  return '<section class="s-panel"><div class="block"><h2>เชื่อมข้อมูล 5ส ของคุณ</h2><p class="root-note">ใช้บัญชี Google ที่มีชื่อในระบบ เพื่อบันทึกงานและตรวจติดตาม</p>'+(message?'<p class="form-error" role="alert">'+esc(message)+'</p>':'')+(configured?'<div class="s-flex" style="gap:12px;flex-wrap:wrap;margin-top:18px"><button type="button" class="s-btn cursor-interaction" data-authorize="true">1. เปิด Google เพื่อตรวจบัญชี</button><button type="button" class="s-btn main cursor-interaction" data-connect="frame">2. เชื่อมต่อและเปิด Dashboard</button></div><p class="context" style="margin-top:16px">ถ้าเชื่อมต่อไม่ได้ ให้ใช้ <button type="button" class="link-action cursor-interaction" data-connect="popup">เชื่อมผ่านหน้าต่าง Google</button> แล้วเปิดหน้าต่างนั้นค้างไว้ระหว่างทำงาน</p>':'<p class="root-note">ตั้ง WEB_APP_URL ด้านบนไฟล์ HTML เป็น URL ของ Apps Script ที่ลงท้าย /exec ตามคู่มือติดตั้งก่อน</p>')+'</div></section>';
}
async function refresh(quiet=false){
  if(state.busy)return;
  try{const result=await rpc('getDashboardData');db=result;state.loaded=true;state.stale=false;render();clearTimeout(timer);timer=setTimeout(()=>{if(document.visibilityState==='visible'&&!['detail','new','audit-new'].includes(state.page))refresh(true);else schedule();},Math.max(30,Number(db.settings.REFRESH_SECONDS)||60)*1000);}
  catch(e){state.stale=true;if(!quiet||!state.loaded){main.innerHTML=connectionPanel(e.message);symbols();}else{state.flash='ข้อมูลยังไม่อัปเดต: '+e.message;render();}announce(e.message);schedule();}
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(document.visibilityState==='visible'&&!['detail','new','audit-new'].includes(state.page))refresh(true);else schedule();},60000)}
function areaPicker(){return '<label class="s-flex" style="font-size:12px">พื้นที่ <select id="s-area" class="s-select"><option value="all">ทุกพื้นที่</option>'+options(db.areas,state.area)+'</select></label>'}
function newButton(){return canCreate()?'<button type="button" class="s-btn main cursor-interaction" data-new="true">'+icon('plus')+'บันทึกปัญหา</button>':''}
function header(title,sub){return '<div class="s-flex spread s-heading"><div><h2>'+title+'</h2><div class="context">'+sub+'</div></div><div class="s-flex">'+areaPicker()+newButton()+'</div></div>'}
function go(page){if(state.busy)return;state.page=page;state.flash='';render();announce('เปลี่ยนหน้าจอ');}
function open(id){if(state.busy)return;if(!['detail','new'].includes(state.page))state.previous=state.page;state.detail=id;go('detail');}
function taskList(filter,area){state.filter=filter;if(area)state.area=area;go('tasks');}
function render(){
  if(!state.loaded)return;
  root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===(['detail','new','audit-new'].includes(state.page)?state.previous:state.page)));
  root.querySelector('#s-open-nav').textContent=db.issues.filter(x=>x.status!=='closed').length;
  root.querySelector('#s-date').textContent='ข้อมูล ณ '+fmt(db.today);
  root.querySelector('#s-account').textContent=name(db.user.email)+' · '+db.user.role;
  main.innerHTML=(state.stale?'<div class="form-error" role="alert">ข้อมูลอาจไม่ล่าสุด กรุณาโหลดใหม่ก่อนบันทึก</div>':'')+(state.flash?'<div class="toast" role="status">'+esc(state.flash)+'</div>':'')+({overview,tasks,repeat:recurrences,detail,new:newIssue,audits,auditsNew:auditForm,'audit-new':auditForm}[state.page]||overview)();
  symbols();if(state.page==='overview')requestAnimationFrame(drawTrend);
}
function metrics(){const a=subset(),op=a.filter(x=>x.status!=='closed'),fixed=a.filter(x=>['monitor','closed'].includes(x.status)),rep=a.filter(x=>x.parentId);const values=[['ยังไม่ปิด',op.length,'รายการ','จากปัญหา '+a.length+' รายการ','open',''],['เกินกำหนด',op.filter(late).length,'รายการ','กำหนดปิดงานเดิม','overdue','red'],['แก้ไขและตรวจผ่าน',a.length?Math.round(fixed.length/a.length*100):'—','%',fixed.length+' / '+a.length+' รายการ','verified','green'],['เกิดซ้ำ',rep.length,'ครั้ง','เหตุการณ์เพิ่มเติมจากครั้งแรก','repeat','']];return '<div class="s-kpis">'+values.map(v=>'<button type="button" class="s-kpi cursor-interaction" data-filter="'+v[4]+'"><div class="k-label">'+v[0]+'</div><div class="k-value num '+v[5]+'">'+v[1]+'<span class="k-unit">'+v[2]+'</span></div><div class="k-foot">'+v[3]+'</div></button>').join('')+'</div>'}
function areaPanel(){return '<section class="s-panel"><div class="panel-head"><h2>ปัญหาแยกตามพื้นที่</h2></div><div class="area-list"><div class="area-head"><span>พื้นที่</span><span>ยังไม่ปิด</span><span>เกินกำหนด</span><span>เกิดซ้ำ</span></div>'+db.areas.map(a=>{const xs=db.issues.filter(x=>x.area===a);return '<button type="button" class="area-row cursor-interaction" data-area-open="'+esc(a)+'"><strong>'+esc(a)+'</strong><span class="num">'+xs.filter(x=>x.status!=='closed').length+'</span><span class="red num">'+xs.filter(late).length+'</span><span class="num">'+xs.filter(x=>x.parentId).length+'</span><span>›</span></button>'}).join('')+'</div></section>'}
function overview(){const a=subset(),open=a.filter(x=>x.status!=='closed').sort(urgent);const unlinked=a.filter(x=>!x.auditId).length;return header('ภาพรวมการแก้ไขและป้องกัน',(state.area==='all'?'ทุกพื้นที่':esc(state.area))+' · '+a.length+' ปัญหาจากข้อมูลจริง')+metrics()+'<div class="s-cols">'+areaPanel()+'<section class="s-panel"><div class="panel-head"><div><h2>แนวโน้มปัญหาต่อ 100 จุดตรวจ</h2><div class="context">5 วันที่ตรวจล่าสุด · ใช้จำนวนจุดที่ตรวจจริง</div></div></div><div class="trends"><svg id="s-trend" class="chart" role="img" aria-label="ปัญหาที่พบและเกิดซ้ำต่อ100จุดตรวจ"></svg><div class="legend"><span><b></b>พบทั้งหมด</span><span><b class="rep"></b>ในจำนวนนี้เป็นปัญหาซ้ำ</span></div><div class="trend-result" id="s-trend-result"></div>'+(unlinked?'<div class="context">'+unlinked+' รายการไม่ผูกรอบตรวจ จึงไม่รวมในแนวโน้ม</div>':'')+'</div></section></div><section class="s-panel"><div class="panel-head"><h2>งานที่ต้องทำต่อ</h2><button class="link-action cursor-interaction" type="button" data-filter="open">ดูทั้งหมด '+open.length+' รายการ →</button></div>'+taskTable(open.slice(0,6))+'</section>'+rankPanel()+'<div class="s-footer"><span>โหลดล่าสุด '+esc(db.serverTime.replace('T',' ').slice(0,19))+'</span><span>บันทึกลง Google Sheets · รูปเก็บในโฟลเดอร์หลักฐาน</span></div>'}
function urgent(a,b){const score=x=>!x.ownerEmail||!x.dueDate?10000:late(x)?5000+days(x.dueDate):x.status==='verify'?1000:0;return score(b)-score(a)||a.foundDate.localeCompare(b.foundDate)}
function taskTable(xs){return '<div class="s-table-wrap"><table class="task-table"><thead><tr><th>ปัญหา / จุดที่พบ</th><th>เจ้าของงาน</th><th>สถานะ / คนที่ต้องทำต่อ</th><th>กำหนดปิดงาน</th><th>ดำเนินการ</th></tr></thead><tbody>'+xs.map(x=>'<tr><td><button type="button" class="problem cursor-interaction" data-issue="'+esc(x.id)+'">'+esc(x.title)+'</button>'+(x.parentId?'<span class="repeat-tag">↻ เกิดซ้ำ</span>':'')+'<div class="row-sub">'+idText(x.id)+' · '+esc(x.area)+' · '+esc(x.location)+'</div></td><td>'+esc(name(x.ownerEmail))+'</td><td>'+badge(x)+'<div class="row-sub">'+next(x)+' · '+esc(name(actor(x)))+'</div></td><td class="num '+(late(x)?'red':'')+'">'+fmt(x.dueDate)+(late(x)?'<div class="row-sub red">เกิน '+days(x.dueDate)+' วัน</div>':'')+'</td><td><button type="button" class="link-action cursor-interaction" data-issue="'+esc(x.id)+'">จัดการ →</button></td></tr>').join('')+(xs.length?'':'<tr><td colspan="5" class="empty">ยังไม่มีปัญหาในเงื่อนไขนี้</td></tr>')+'</tbody></table></div>'}
const filters=[['open','ยังไม่ปิด'],['overdue','เกินกำหนด'],['verify','รอตรวจแก้ไข'],['monitor','ติดตามป้องกัน'],['repeat','เกิดซ้ำ'],['verified','แก้ไขตรวจผ่าน'],['all','ทั้งหมด']];
function tasks(){const xs=subset().filter(x=>({open:x.status!=='closed',overdue:late(x),verify:x.status==='verify',monitor:x.status==='monitor',repeat:!!x.parentId,verified:['monitor','closed'].includes(x.status),all:true})[state.filter]).sort(urgent);return header('ติดตามงาน 5ส',xs.length+' รายการ')+'<div class="filters">'+filters.map(f=>'<button type="button" class="filter cursor-interaction" data-filter="'+f[0]+'" aria-pressed="'+(state.filter===f[0])+'">'+f[1]+'</button>').join('')+'</div><section class="s-panel">'+taskTable(xs)+'</section>'}

async function imagePayload(file){if(!(file instanceof File)||!file.size)return undefined;if(file.size>20000000)throw new Error('กรุณาใช้รูปต้นฉบับขนาดไม่เกิน 20 MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('ใช้ภาพ JPEG, PNG หรือ WebP');const bitmap=await createImageBitmap(file);try{const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);let url=canvas.toDataURL('image/jpeg',.8);if(url.length>1700000)url=canvas.toDataURL('image/jpeg',.55);if(url.length>1700000)throw new Error('ภาพยังใหญ่เกินไป กรุณาลดขนาดภาพ');return {mimeType:'image/jpeg',base64:url.split(',')[1]};}finally{bitmap.close();}}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||state.busy)return;const d=b.dataset;if(d.authorize){try{FiveSApi.authorize();announce('เปิด Google เพื่อตรวจบัญชีแล้ว กลับมากดเชื่อมต่อหลังอนุญาตสิทธิ์');}catch(e){main.innerHTML=connectionPanel(e.message);}return;}if(d.connect){const generation=++connectionGeneration;b.disabled=true;b.textContent='กำลังเชื่อมต่อ…';try{await FiveSApi.connect({popup:d.connect==='popup'});if(generation!==connectionGeneration)return;state.loaded=false;state.page='overview';state.detail=null;state.stale=true;await refresh();}catch(e){if(generation===connectionGeneration){main.innerHTML=connectionPanel(e.message);announce(e.message);}}finally{b.disabled=false;}return;}if(d.refresh){refresh();return}if(d.page){go(d.page);return}if(d.issue){open(d.issue);return}if(d.filter){taskList(d.filter);return}if(d.areaOpen){taskList('open',d.areaOpen);return}if(d.repeatArea){state.area=d.repeatArea;go('repeat');return}if(d.back){go(state.previous);return}if(d.new||d.recur){if(!canCreate())return;state.previous=state.page==='detail'?state.previous:state.page;state.parent=d.recur||null;go('new');return}if(d.newAudit){state.previous='audits';go('audit-new');return}if(d.image){const box=root.querySelector('#evidence-'+d.image);b.disabled=true;try{const image=await rpc('getEvidenceImage',state.detail,d.image);box.innerHTML='<img src="'+image.dataUrl+'" alt="ภาพหลักฐาน '+esc(d.image)+'">';}catch(e){b.disabled=false;announce(e.message);box.insertAdjacentHTML('beforeend','<small class="red">'+esc(e.message)+'</small>');}}});
root.addEventListener('change',e=>{if(e.target.id==='s-area'){state.area=e.target.value;render();}if(e.target.name==='area'&&state.page==='new'){const s=root.querySelector('[name="auditId"]');if(s)s.innerHTML=options(db.audits.filter(a=>a.area===e.target.value).map(a=>({value:a.id,label:fmt(a.date)+' · '+a.label})),'','ไม่ผูกรอบตรวจ');}});
root.addEventListener('submit',async e=>{e.preventDefault();if(state.busy)return;const form=e.target;if(!['s-action-form','s-plan-form'].includes(form.id))return;const fd=new FormData(form),payload={};fd.forEach((v,k)=>{if(!(v instanceof File))payload[k]=v;});payload.action=e.submitter?.value||form.dataset.action;payload.verified=fd.has('verified');payload.noRepeat=fd.has('noRepeat');if(!['create','audit'].includes(payload.action)){const x=db.issues.find(x=>x.id===state.detail);payload.id=x.id;payload.version=x.version;}const error=form.querySelector('.s-form-error');error.hidden=true;
  if(state.stale){error.textContent='กรุณาโหลดข้อมูลใหม่ก่อนบันทึก';error.hidden=false;return;}
  state.busy=true;const buttons=[...root.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
  let committed=false;
  try{for(const key of ['beforeImage','afterImage','followupImage']){const file=fd.get(key);if(file instanceof File&&file.size)payload[key]=await imagePayload(file);}const result=await rpc(payload.action==='audit'?'saveAudit':'saveIssue',payload);committed=true;state.detail=result.id;state.page=payload.action==='audit'?'audits':'detail';const fresh=await rpc('getDashboardData');db=fresh;state.stale=false;state.flash=result.message;if(payload.action==='audit')state.page='audits';else{state.detail=result.id;state.page='detail';}render();announce(result.message);}
  catch(err){if(committed||err.kind==='WRITE_RESULT_UNKNOWN')state.stale=true;error.textContent=committed?'บันทึกแล้ว แต่โหลดข้อมูลใหม่ไม่สำเร็จ กรุณากดโหลดข้อมูลใหม่: '+err.message:err.message;error.hidden=false;announce(error.textContent);}
  finally{state.busy=false;root.querySelectorAll('button').forEach(b=>b.disabled=false);}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.loaded&&!['detail','new','audit-new'].includes(state.page))refresh(true);});
if(window.ResizeObserver)new ResizeObserver(()=>{if(state.page==='overview'&&state.loaded)drawTrend();}).observe(main);
window.addEventListener('five-s-connection',e=>{if(!e.detail.connected&&state.loaded){state.stale=true;state.flash=e.detail.message;if(state.busy||['detail','new','audit-new'].includes(state.page)){announce(e.detail.message);}else{render();}}});
main.innerHTML=connectionPanel();
})();
</script></body></html>
