<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Operator Certificate Template</title>
    <!-- Load Tailwind CSS for styling the UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts for standard text supporting Thai/English -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
        
        /* The container for the certificate, using container-type to enable scalable font sizes */
        #certificate-container {
            container-type: inline-size;
            aspect-ratio: 1 / 1.414; /* A4/A5/A6 standard vertical aspect ratio */
            position: relative;
            background-color: white; /* Fallback color */
        }

        /* Base styles for all overlay inputs */
        .cert-input {
            position: absolute;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px dashed #9ca3af; /* gray-400 */
            border-radius: 4px;
            font-family: 'Sarabun', sans-serif;
            font-size: 2.2cqw; /* Scales based on container width */
            color: #1f2937;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
            /* ทำให้กรอบยืดหดตามตัวอักษร (Shrink-wrap) */
            white-space: nowrap;
            display: inline-block;
            cursor: text;
        }

        /* สร้าง Placeholder แบบจำลองสำหรับ ContentEditable */
        .cert-input:empty::before {
            content: attr(data-placeholder);
            color: #9ca3af;
            pointer-events: none;
        }

        .cert-input:focus, .cert-input:hover {
            background-color: rgba(255, 255, 255, 0.95);
            border-color: #3b82f6; /* blue-500 */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Specific text alignments */
        .text-left-input { 
            text-align: left; 
            padding: 0.3cqw 1cqw; 
        }
        .text-center-input { 
            text-align: center; 
            padding: 0.3cqw 1cqw; 
            /* ล็อกจุดศูนย์กลางไว้ที่เดิม กรอบจะขยายออกสองข้างเท่าๆ กัน */
            transform: translateX(-50%); 
        }

        /* Print Media Query: This is crucial for rendering the PDF/Print correctly */
        @media print {
            /* Force browsers to print background colors and images */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Hide UI controls during print */
            .no-print { display: none !important; }
            
            /* Reset body margins to allow page size to dictate */
            body, html {
                margin: 0;
                padding: 0;
                background-color: white;
            }

            /* Make the preview area fill the print page */
            #preview-section {
                padding: 0 !important;
                margin: 0 !important;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* The certificate fills the page according to @page size */
            #certificate-container {
                width: 100vw;
                height: 100vh;
                max-width: none !important;
                max-height: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            /* Make inputs look like standard text on paper */
            .cert-input {
                border: none !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* If the user typed something, add a white background on print 
               to cover any pre-existing text in the template (like "合格") */
            .cert-input.has-value {
                background-color: white !important;
            }

            /* Hide placeholders on print */
            .cert-input:empty::before { 
                color: transparent !important; 
            }

            /* Clean up photo upload zone for printing */
            #photo-upload-zone { 
                border: none !important; 
                background-color: transparent !important; 
            }
            #photo-upload-prompt { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar / Controls -->
    <aside class="w-full md:w-80 bg-white border-r border-gray-200 shadow-xl flex flex-col no-print z-50">
        <div class="p-6 bg-blue-600 text-white">
            <h1 class="text-xl font-bold">Certificate Template</h1>
            <p class="text-sm opacity-80 mt-1">ตั้งค่าและจัดการแบบฟอร์ม</p>
        </div>
        
        <div class="p-6 flex-1 flex flex-col gap-5">
            <!-- Instructions -->
            <div class="bg-blue-50 text-blue-800 p-4 rounded-lg text-sm border border-blue-100">
                <ul class="list-disc list-inside space-y-1">
                    <li>คลิกที่กรอบ <b>Picture</b> เพื่ออัปโหลดรูปภาพผู้ใช้งาน</li>
                    <li>คลิกที่พื้นที่ว่างเพื่อพิมพ์ข้อความ</li>
                    <li>เลือกขนาดกระดาษที่ต้องการก่อนพิมพ์</li>
                </ul>
            </div>

            <hr class="border-gray-200">

            <!-- Page Size Selector -->
            <div>
                <label for="page-size" class="block text-sm font-semibold text-gray-700 mb-2">ขนาดกระดาษ (Page Size)</label>
                <select id="page-size" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    <option value="A4">A4 (210 × 297 mm)</option>
                    <option value="A5">A5 (148 × 210 mm)</option>
                    <option value="A6">A6 (105 × 148 mm)</option>
                </select>
            </div>

            <hr class="border-gray-200">

            <!-- Print Button -->
            <button onclick="window.print()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                พิมพ์ / บันทึก PDF
            </button>
            
            <button onclick="resetForm()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition-colors mt-auto">
                ล้างข้อมูล (Reset)
            </button>
        </div>
    </aside>

    <!-- Main Preview Area -->
    <main id="preview-section" class="flex-1 bg-gray-200 p-4 md:p-8 flex justify-center items-start overflow-y-auto">
        
        <!-- The Certificate -->
        <div id="certificate-container" class="relative w-full max-w-[800px] shadow-2xl rounded-sm bg-white overflow-hidden" style="aspect-ratio: 1 / 1.414;">
            
            <!-- Google Drive Background Image with Error Handling -->
            <img id="template-bg" 
                 src="https://drive.google.com/thumbnail?id=1P1Oqss79TTTTuUbJN25xADlCuzivRaNm&sz=w2000" 
                 alt="Template Background" 
                 class="absolute inset-0 w-full h-full z-0 pointer-events-none object-fill" 
                 onerror="this.style.display='none'; document.getElementById('bg-error-msg').style.display='flex';">
            
            <!-- Fallback Error Message (Shown only if image fails to load) -->
            <div id="bg-error-msg" class="absolute inset-0 z-0 hidden flex-col items-center justify-center bg-gray-100 border-2 border-dashed border-gray-300 text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <p class="font-bold text-xl text-gray-700">โหลดรูปแม่แบบไม่สำเร็จ</p>
                <p class="text-md mt-2">โปรดตรวจสอบลิงก์ Google Drive หรือการเชื่อมต่ออินเทอร์เน็ต</p>
            </div>

            <!-- Photo Upload Zone (Top Right) -->
            <!-- Position manually adjusted to fit the "Picture" blue box in the template -->
            <div id="photo-upload-zone" class="absolute cursor-pointer border-2 border-dashed border-blue-400 bg-blue-100/30 hover:bg-blue-200/50 flex flex-col items-center justify-center overflow-hidden z-10 transition-colors"
                 style="top: 17.5%; left: 65.5%; width: 25.5%; height: 22%;">
                <div id="photo-upload-prompt" class="text-blue-600 text-[1.5cqw] font-semibold text-center px-2 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-[4cqw] w-[4cqw] mx-auto mb-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    คลิกอัปโหลดรูป
                </div>
                <img id="photo-preview" class="hidden absolute inset-0 w-full h-full object-cover z-20 pointer-events-none">
            </div>
            <input type="file" id="photo-input" class="hidden" accept="image/*">

            <!-- Equipment Operator Name -->
            <div contenteditable="true" class="cert-input text-left-input" 
                 style="top: 27.2%; left: 37%; max-width: 40%;" 
                 data-placeholder="พิมพ์ชื่อ-นามสกุล..."></div>

            <!-- Equipment Number -->
            <div contenteditable="true" class="cert-input text-left-input" 
                 style="top: 55.2%; left: 37%; max-width: 50%;" 
                 data-placeholder="พิมพ์หมายเลขอุปกรณ์..."></div>

            <!-- Training Record Table Row -->
            <!-- Date (วันที่สอบ) -->
            <div contenteditable="true" class="cert-input text-center-input" 
                 style="top: 81.3%; left: 15.9%; max-width: 15%;" 
                 data-placeholder="วว/ดด/ปปปป"></div>
                   
            <!-- Device Name (ชื่ออุปกรณ์) -->
            <div contenteditable="true" class="cert-input text-center-input" 
                 style="top: 81.3%; left: 32%; max-width: 17%;" 
                 data-placeholder="ชื่ออุปกรณ์"></div>

            <!-- Theory Score (ผลสอบทฤษฎี) -->
            <div contenteditable="true" class="cert-input text-center-input" 
                 style="top: 81.3%; left: 49.6%; max-width: 17%;" 
                 data-placeholder="คะแนนทฤษฎี"></div>

            <!-- Practice Score (ผลสอบปฏิบัติ) -->
            <div contenteditable="true" class="cert-input text-center-input" 
                 style="top: 81.3%; left: 67.3%; max-width: 17%;" 
                 data-placeholder="พิมพ์เพื่อแก้ '合格'"></div>

            <!-- Expiry Date (วันหมดอายุ) -->
            <div contenteditable="true" class="cert-input text-center-input" 
                 style="top: 81.3%; left: 83.75%; max-width: 15%;" 
                 data-placeholder="วว/ดด/ปปปป"></div>

        </div>
    </main>

    <script>
        // 0. Set up template background element
        const templateBg = document.getElementById('template-bg');
        const bgErrorMsg = document.getElementById('bg-error-msg');

        // 1. Handle Photo Upload Logic (For the user's Picture box)
        const photoZone = document.getElementById('photo-upload-zone');
        const photoInput = document.getElementById('photo-input');
        const photoPreview = document.getElementById('photo-preview');
        const photoPrompt = document.getElementById('photo-upload-prompt');

        // Trigger file input when clicking the zone
        photoZone.addEventListener('click', () => {
            photoInput.click();
        });

        // Read file and set as image source
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photoPreview.src = event.target.result;
                    photoPreview.classList.remove('hidden');
                    photoPrompt.classList.add('hidden');
                    // Remove dashed border when image is present
                    photoZone.style.border = 'none';
                    photoZone.style.backgroundColor = 'transparent';
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. Handle Dynamic Page Sizing for Print
        const sizeSelector = document.getElementById('page-size');
        const printStyle = document.createElement('style');
        document.head.appendChild(printStyle);

        function updatePageSize() {
            const size = sizeSelector.value;
            // Inject a dynamic @page rule to tell the browser the exact paper size
            printStyle.innerHTML = `@page { size: ${size}; margin: 0; }`;
        }
        
        // Listen to changes in the dropdown
        sizeSelector.addEventListener('change', updatePageSize);
        // Set initial size
        updatePageSize();

        // 3. Handle Input Backgrounds for Print
        const inputs = document.querySelectorAll('.cert-input');
        inputs.forEach(input => {
            // บล็อกการกด Enter ไม่ให้ขึ้นบรรทัดใหม่
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur(); 
                }
            });

            input.addEventListener('input', function() {
                // แก้บัค Browser แอบใส่ <br> เวลาลบข้อความจนหมด
                if (this.textContent.trim().length === 0 && this.innerHTML !== '') {
                    this.innerHTML = ''; 
                }

                if (this.textContent.trim().length > 0) {
                    this.classList.add('has-value');
                } else {
                    this.classList.remove('has-value');
                }
            });
        });

        // 4. Reset Form Function
        function resetForm() {
            if(confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างข้อมูลทั้งหมด?')) {
                // Clear all text inputs
                inputs.forEach(input => {
                    input.textContent = '';
                    input.classList.remove('has-value');
                });
                // Clear photo
                photoInput.value = '';
                photoPreview.src = '';
                photoPreview.classList.add('hidden');
                photoPrompt.classList.remove('hidden');
                photoZone.style.border = '';
                photoZone.style.backgroundColor = '';
                
                // Reset background image link to the new Google Drive format
                templateBg.src = 'https://drive.google.com/thumbnail?id=1P1Oqss79TTTTuUbJN25xADlCuzivRaNm&sz=w2000';
                templateBg.style.display = 'block';
                bgErrorMsg.style.display = 'none';
                
                // Reset size to A4
                sizeSelector.value = 'A4';
                updatePageSize();
            }
        }
    </script>
</body>
</html>
